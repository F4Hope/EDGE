name: EDGE CI

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Test provider normalization
        run: npm run test:providers

      - name: Test odds normalization
        run: npm run test:odds

      - name: Test feature engine
        run: npm run test:features

      - name: Test audit and intelligence
        run: npm run test:audit

      - name: Test production utilities
        run: npm run test:production

      - name: Test system readiness
        run: npm run test:readiness

      - name: Test data freshness semantics
        run: npm run test:freshness

      - name: Test provider sync checkpoints
        run: npm run test:sync-checkpoints

      - name: Test local database bootstrap configuration
        run: npm run test:local-db

      - name: Test Codespace recovery configuration
        run: npm run test:codespace

      - name: Test result provider normalization
        run: npm run test:results-provider

      - name: Test provider injury intelligence normalization
        run: npm run test:intelligence-provider

      - name: Test event-change intelligence
        run: npm run test:event-changes

      - name: Test safe data refresh orchestration
        run: npm run test:data-refresh

      - name: Test mobile routes
        run: npm run test:ui

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
