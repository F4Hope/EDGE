name: EDGE CI

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Audit full dependency tree for critical issues
        run: npm run audit:critical

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Test provider normalization
        run: npm run test:providers

      - name: Test provider credential health
        run: npm run test:provider-health

      - name: Test odds normalization
        run: npm run test:odds

      - name: Test feature engine
        run: npm run test:features

      - name: Test prediction model
        run: npm run test:predictions

      - name: Test opportunities
        run: npm run test:opportunities

      - name: Test combo engine
        run: npm run test:combos

      - name: Test settled recent-form features
        run: npm run test:form

      - name: Test settled head-to-head features
        run: npm run test:h2h

      - name: Test audit and intelligence
        run: npm run test:audit

      - name: Test production utilities
        run: npm run test:production

      - name: Test system readiness
        run: npm run test:readiness

      - name: Test data freshness semantics
        run: npm run test:freshness

      - name: Test provider sync checkpoints
        run: npm run test:sync-checkpoints

      - name: Test local database bootstrap configuration
        run: npm run test:local-db

      - name: Test Codespace recovery configuration
        run: npm run test:codespace

      - name: Test result provider normalization
        run: npm run test:results-provider

      - name: Test provider injury intelligence normalization
        run: npm run test:intelligence-provider

      - name: Test event-change intelligence
        run: npm run test:event-changes

      - name: Test safe data refresh orchestration
        run: npm run test:data-refresh

      - name: Test evidence refresh workflow
        run: npm run test:evidence-refresh-workflow

      - name: Test deployment safety
        run: npm run test:deployment

      - name: Test production container contract
        run: npm run test:container

      - name: Test runtime operations
        run: npm run test:operations

      - name: Test API production envelope
        run: npm run test:api-production

      - name: Test public request guards
        run: npm run test:request-guards

      - name: Test Setup Center planning
        run: npm run test:setup

      - name: Test live launch gate
        run: npm run test:launch

      - name: Test release metadata
        run: npm run test:release

      - name: Test mobile routes
        run: npm run test:ui

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  migration:
    name: Validate migration history
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://edge:edge@127.0.0.1:5432/edge?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edge
          POSTGRES_PASSWORD: edge
          POSTGRES_DB: edge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge -d edge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply committed migrations
        run: npm run db:deploy

      - name: Verify zero migration drift
        run: npm run db:drift:check


  container:
    name: Build production container
    needs:
      - validate
      - migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: >-
          docker build
          --build-arg EDGE_BUILD_SHA=${{ github.sha }}
          --tag edge-ci:${{ github.sha }}
          .

      - name: Smoke standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name edge-smoke -p 3000:3000 edge-ci:${{ github.sha }}
          trap 'docker stop edge-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/health/live >/tmp/edge-live.json; then
              break
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:3000/api/health/live
          test "$(curl --silent --output /tmp/edge-ready.json --write-out '%{http_code}' http://127.0.0.1:3000/api/health/ready)" = "503"
          curl --silent --fail http://127.0.0.1:3000/api/version | grep --fixed-strings "${{ github.sha }}" > /dev/null

          curl --silent --show-error --dump-header /tmp/edge-headers.txt --output /dev/null http://127.0.0.1:3000/api/health/live
          grep --ignore-case '^content-security-policy:' /tmp/edge-headers.txt
          grep --ignore-case '^strict-transport-security:' /tmp/edge-headers.txt
          grep --ignore-case '^cross-origin-opener-policy: same-origin' /tmp/edge-headers.txt
          grep --ignore-case '^cross-origin-resource-policy: same-origin' /tmp/edge-headers.txt
