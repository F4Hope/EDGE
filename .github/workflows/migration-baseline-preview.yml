name: Prisma Baseline Preview

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
      - "scripts/create-baseline-migration.ts"
      - ".github/workflows/migration-baseline-preview.yml"

jobs:
  preview:
    name: Generate baseline SQL preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate exact Prisma baseline SQL
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output /tmp/edge-baseline.sql
          echo "----- EDGE BASELINE SQL START -----"
          cat /tmp/edge-baseline.sql
          echo "----- EDGE BASELINE SQL END -----"
